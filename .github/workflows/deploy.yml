name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: astro.config.mjs dates every sitemap <lastmod> from
          # the last commit that touched the page's source. On the default
          # shallow clone every file dates to HEAD, so every page would claim
          # to have changed on every deploy — the config drops the dates in
          # that case, which is safe but leaves Google with no signal again.
          fetch-depth: 0
      - name: Install, build, and upload the Astro site
        uses: withastro/action@v6
        # Defaults: package manager auto-detected, build runs `astro build`,
        # and the `dist/` output is uploaded as the Pages artifact.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
